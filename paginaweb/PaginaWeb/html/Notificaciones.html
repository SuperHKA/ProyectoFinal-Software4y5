<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones - FisClase</title>
    <link rel="stylesheet" href="../css/Diseno.css">
    <link rel="stylesheet" href="../css/NotificacionDiseño.css">
    <link rel="stylesheet" href="../css/ApiStatus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="../js/ApiStatusChecker.js"></script>
    <script src="../js/AuthService.js"></script>
    <script src="../js/HeaderUser.js"></script>
    <script src="../js/NotificacionesHandler.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
<header class="site-header">
    <a href="Pagina_Principal.html" class="container logo">
        <img class="Titulo" src="../src/noname-cutout.png" alt="FisClase - Inicio">
    </a>

    <nav class="main-nav">
        <ul>
            <li><a href="Pagina_Principal.html">Inicio</a></li>
            <li><a href="quienes-somos.html">¿Quienes Somos?</a></li>
            <li><a href="contactenos.html">Contactenos</a></li>
        </ul>
    </nav>

    <a href="Profile.html">
        <div class="user-info">
            <div class="user-avatar">JS</div>
            <span>Usuario</span>
        </div>
    </a>
</header>

<div class="dashboard-container">
    <aside class="sidebar">
        <h3>Menú Principal</h3>
        <ul class="sidebar-menu">
            <li><a href="Profile.html"><i class="fas fa-user"></i>Usuario</a></li>
            <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="notificaciones.html" class="active"><i class="fas fa-bell"></i> Notificaciones</a></li>
            <li><a href="transacciones.html"><i class="fas fa-dollar-sign"></i> Transacciones</a></li>
            <li><a href="transferencias.html"><i class="fas fa-exchange-alt"></i> Transferencias</a></li>
            <li><a href="cuentas.html"><i class="fas fa-university"></i> Mis Cuentas</a></li>
            <li><a href="Historial.html"><i class="fas fa-history"></i> Historial</a></li>
            <li><a href="#" onclick="authService.logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="notifications-header">
            <h1><i class="fas fa-bell"></i> Notificaciones</h1>
            <div class="notifications-actions">
                <button class="btn-outline" onclick="markAllAsRead()" title="Marcar todas como leídas">
                    <i class="fas fa-check-double"></i> Marcar todas como leídas
                </button>
                <button class="btn-outline" onclick="clearReadNotifications()" title="Limpiar leídas">
                    <i class="fas fa-broom"></i> Limpiar leídas
                </button>
            </div>
        </div>

        <div class="notificaciones-container">
            <!-- Las notificaciones se cargarán dinámicamente aquí -->
            <div class="loading-notificaciones">
                <div class="loading-spinner"></div>
                <p>Cargando notificaciones...</p>
            </div>
        </div>
    </main>
</div>

<footer>
    <div class="link_footer">
        <ul>
            <li><a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a></li>
