<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contactenos - FisClase</title>
    <script src="Opciones.js"></script>
    <link rel="stylesheet" href="contactenos.css">
    <link rel="stylesheet" href="Diseño.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<header class="site-header">
    <div class="container logo">
        <img class="Titulo" src="src\noname-cutout.png" alt="Descripción de la imagen">
    </div>

    <!-- Menú de navegación agregado aquí -->
    <nav class="main-nav">
        <ul>
            <li><a href="Pagina_Principal.html">Inicio</a></li>
            <li><a href="quienes-somos.html">¿Quienes Somos?</a></li>
            <li><a href="contactenos.html">Contactenos</a></li>
        </ul>
    </nav>

    <div class="header-content">
        <div class="boton_cuenta">
            <form action="">
                <button type="button" class="cuenta" onclick="aparecerCuadro()">
                    <p class="fount_cuenta">Cuenta</p>
                </button>
            </form>
        </div>
    </div>
</header>

<div id="cuadro-opciones" class="opciones" >
    <button type="button" class="opcion-btn1" onclick="window.location.href='Login.html'">Ingresar</button>
    <button type="button" class="opcion-btn2" onclick="window.location.href='Register.html'">Registrarse</button>
</div>


    <section id="contactenos" class="contactenos-section">
        <div class="contactenos-container">
            <h2 class="section-title">Contáctenos</h2>
            <div class="contactenos-content">
                <div class="contact-info">
                    <h3>Estamos aquí para ayudarte</h3>
                    <div class="contact-item">
                        <i class="fas fa-phone"></i>
                        <div>
                            <h4>Teléfono</h4>
                            <p>+1 (800) 123-4567</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <div>
                            <h4>Email</h4>
                            <p>info@fisclase.com</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-clock"></i>
                        <div>
                            <h4>Horario de Atención</h4>
                            <p>Lunes a Viernes: 8:00 AM - 8:00 PM</p>
                            <p>Sábados: 9:00 AM - 2:00 PM</p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div>
                            <h4>Dirección</h4>
                            <p>Av. Principal #123, Ciudad Financiera</p>
                        </div>
                    </div>
                </div>
                
                <div class="contact-form">
                    <h3>Envíanos un mensaje</h3>
                    <form class="formulario-contacto">
                        <div class="form-group">
                            <input type="text" placeholder="Tu nombre" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Tu email" required>
                        </div>
                        <div class="form-group">
                            <input type="text" placeholder="Asunto" required>
                        </div>
                        <div class="form-group">
                            <textarea placeholder="Tu mensaje" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

<footer>
    <div class="link_footer">
        <ul>
            <li><a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a></li>
            <li><a href="https://www.youtube.com" target="_blank"><i class="fab fa-youtube"></i></a></li>
            <li><a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a></li>
            <li><a href="https://www.X.com" target="_blank"><i class="fab fa-twitter"></i></a></li>
            <li><a href="https://web.whatsapp.com" target="_blank"><i class="fab fa-whatsapp"></i></a></li>
        </ul>
    </div>
</footer>


</body>
</html>
