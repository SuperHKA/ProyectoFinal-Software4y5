<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisClase - Construimos tu futuro</title>
    <link rel="stylesheet" href="../css/Diseño.css">
    <link rel="stylesheet" href="../css/DiseñoRegistrar.css">
    <script src="../js/Opciones.js"></script>
    <script src="../js/RegisterHandler.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<header class="site-header">
    <div class="container logo">
        <img class="Titulo" src="../src/noname-cutout.png" alt="Descripción de la imagen">
    </div>

    <nav class="main-nav">
        <ul>
            <li><a href="Pagina_Principal.html">Inicio</a></li>
            <li><a href="quienes-somos.html">¿Quienes Somos?</a></li>
            <li><a href="contactenos.html">Contactenos</a></li>
        </ul>
    </nav>

    <div class="header-content">
        <div class="boton_cuenta">
            <form action="">
                <button type="button" class="cuenta" onclick="aparecerCuadro()">
                    <p class="fount_cuenta">Cuenta</p>
                </button>
            </form>
        </div>
    </div>
</header>

<div id="cuadro-opciones" class="opciones">
    <button type="button" class="opcion-btn1" onclick="window.location.href='Login.html'">Ingresar</button>
    <button type="button" class="opcion-btn2" onclick="window.location.href='Register.html'">Registrarse</button>
</div>

<!-- Contenedor principal que mantiene todo junto -->
<div class="register-container">
    <!-- Sección izquierda con cuadro rosa e información -->
    <div class="cont-cuadro">
        <div class="cuadro"></div>
        <div class="login-left">
            <img class="logo" src="src\noname-cutout.png" alt="Descripción de la imagen">
            <h2>Sistema de Administración Bancaria</h2>
            <p>Gestiona todas las operaciones de tu institución</p>
            <p>financiera desde un solo lugar, seguro, rápido y confiable.</p>
            <br>
            <h2>¿Ya tienes alguna cuenta?</h2>
            <button type="button" class="Registrar" onclick="moverLoginIzquierda()">Iniciar Sesión</button>
        </div>
    </div>

    <!-- Sección derecha con formulario -->
    <div class="form-container">
        <form action="/submit" method="POST" class="inicio">
            <h1>Crear cuenta</h1>
            <div class="form-grid">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required>
                </div>

                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" required>
                </div>

                <div class="form-group">
                    <label for="confirmar-contraseña">Confirmar Contraseña</label>
                    <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" required>
                </div>

                <div class="form-group">
                    <label for="nombre-completo">Nombre Completo</label>
                    <input type="text" id="nombre-completo" name="nombre-completo" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>
            </div>

            <div class="form-full">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion">
            </div>
            <button type="submit">Enviar</button>
        </form>
    </div>
</div>

<footer>
    <div class="link_footer">
        <ul>
            <li><a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a></li>
            <li><a href="https://www.youtube.com" target="_blank"><i class="fab fa-youtube"></i></a></li>
            <li><a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a></li>
            <li><a href="https://www.X.com" target="_blank"><i class="fab fa-twitter"></i></a></li>
            <li><a href="https://web.whatsapp.com" target="_blank"><i class="fab fa-whatsapp"></i></a></li>
        </ul>
    </div>
</footer>

</body>
</html>
